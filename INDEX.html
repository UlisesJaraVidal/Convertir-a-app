<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Convierte imágenes a WebP en tu navegador, sin subirlas a ningún servidor. Gratis, privado y rápido.">
  <title>Convertir imagen a WebP online — Gratis y privado</title>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#e2e8f0;--muted:#94a3b8}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
    main{max-width:640px;margin:0 auto;padding:20px}
    h1{font-size:1.6rem;margin:0 0 8px}
    p{color:var(--muted);margin:0 0 16px}
    .card{background:var(--card);border-radius:12px;padding:20px}
    input[type=file]{width:100%;padding:14px;border:2px dashed #475569;border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
    input[type=file]:hover{border-color:var(--accent)}
    button{margin-top:12px;padding:12px 20px;background:var(--accent);color:#0f172a;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;width:100%}
    button:disabled{opacity:.5;cursor:not-allowed}
    .info{margin-top:16px;font-size:.9rem;color:var(--muted)}
    .result{margin-top:16px;padding:14px;background:#0f172a;border-radius:8px;display:none}
    .result a{color:var(--accent);font-weight:600;display:inline-block;margin-top:8px}
    .preview{margin-top:12px;max-width:100%;border-radius:8px;display:none}
    .privacy{font-size:.85rem;color:var(--muted);margin-top:20px;padding:12px;border-left:3px solid var(--accent);background:#0f172a}
    footer{margin-top:24px;font-size:.8rem;color:var(--muted);text-align:center}
    footer a{color:var(--muted)}
  </style>
</head>
<body>
<main>
  <h1>Convertir imagen a WebP</h1>
  <p>Reduce el peso de tus imágenes directamente en tu navegador. <strong>No se suben a ningún servidor</strong>: todo ocurre en tu dispositivo.</p>

  <div class="card">
    <input id="file" type="file" accept="image/*">
    <button id="btn" disabled>Convertir a WebP</button>
    <img id="preview" class="preview" alt="Vista previa">
    <div id="result" class="result"></div>
    <div id="info" class="info"></div>
  </div>

  <div class="privacy">🔒 <strong>Privacidad:</strong> tus imágenes nunca salen de tu dispositivo. El procesamiento se hace con la API Canvas de tu navegador.</div>

  <div id="ad-slot" style="margin-top:20px"></div>

  <footer><a href="privacidad.html">Política de privacidad</a></footer>
</main>

<script>
const fileInput = document.getElementById('file');
const btn = document.getElementById('btn');
const preview = document.getElementById('preview');
const result = document.getElementById('result');
const info = document.getElementById('info');
let currentFile = null;

fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  currentFile = f;
  btn.disabled = false;
  preview.src = URL.createObjectURL(f);
  preview.style.display = 'block';
  info.textContent = `Archivo: ${f.name} (${(f.size/1024).toFixed(1)} KB)`;
  result.style.display = 'none';
});

btn.addEventListener('click', () => {
  if (!currentFile) return;
  btn.disabled = true;
  btn.textContent = 'Convirtiendo...';
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    canvas.toBlob((blob) => {
      if (!blob) {
        result.textContent = 'Tu navegador no soporta WebP.';
        result.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Convertir a WebP';
        return;
      }
      const url = URL.createObjectURL(blob);
      const name = currentFile.name.replace(/\.[^.]+$/, '') + '.webp';
      const ahorro = ((1 - blob.size / currentFile.size) * 100).toFixed(1);
      result.innerHTML = `<div>✅ Listo: <strong>${(blob.size/1024).toFixed(1)} KB</strong> (${ahorro}% menos)</div>
        <a href="${url}" download="${name}">⬇️ Descargar ${name}</a>`;
      result.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Convertir a WebP';
    }, 'image/webp', 0.9);
  };
  img.src = URL.createObjectURL(currentFile);
});
</script>
<!-- Aquí irá el script de Adsterra/Monetag -->
</body>
</html>
